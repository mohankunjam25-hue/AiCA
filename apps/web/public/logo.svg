<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>

    <!-- Emerald Leaf / Bracket Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#196c2e" />
    </linearGradient>

    <!-- Ruby Accent Gradient -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149" />
      <stop offset="100%" stop-color="#cf222e" />
    </linearGradient>

    <!-- Gold Text Gradient for GV2 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cc60" />
      <stop offset="50%" stop-color="#e3b341" />
      <stop offset="100%" stop-color="#d29922" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#30363d" stroke-width="3" filter="url(#subtleGlow)" />

  <!-- Outer Stylized Code Leaf / Orbit Curves -->
  <!-- Left Emerald Arc -->
  <path d="M 32 92 C 16 76 16 44 34 26 C 46 14 66 12 84 18 C 70 24 50 32 40 46 C 30 60 30 78 32 92 Z" fill="url(#emeraldGrad)" opacity="0.9" />

  <!-- Right Ruby Arc -->
  <path d="M 88 28 C 104 44 104 76 86 94 C 74 106 54 108 36 102 C 50 96 70 88 80 74 C 90 60 90 42 88 28 Z" fill="url(#rubyGrad)" opacity="0.85" />

  <!-- Center Monospace Tag: <GV2/> -->
  <g filter="url(#subtleGlow)">
    <!-- Opening Bracket '<' in Emerald -->
    <text x="32" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="900" fill="#3fb950" text-anchor="middle">&lt;</text>
    
    <!-- Core 'GV2' in Radiant Gold -->
    <text x="60" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-0.5px">GV2</text>
    
    <!-- Closing Bracket '/>' in Ruby -->
    <text x="88" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="900" fill="#f85149" text-anchor="middle">/&gt;</text>
  </g>
</svg>
